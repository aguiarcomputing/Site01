<style>
    /* WhatsApp Floating Button Styles */
    .whatsapp-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #25d366;
        color: white;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        z-index: 1000;
        text-decoration: none;
        transition: transform 0.3s ease, background-color 0.3s ease;
        animation: heartbeat 2s infinite;
    }

    /* Hover Effect */
    .whatsapp-button:hover {
        background-color: #1ebc57;
        transform: scale(1.15);
    }

    /* WhatsApp Icon */
    .whatsapp-button img {
        width: 32px;
        height: 32px;
    }

    /* Heartbeat Animation */
    @keyframes heartbeat {
        0% {
            transform: scale(1);
        }
        20% {
            transform: scale(1.2);
        }
        40% {
            transform: scale(1);
        }
        60% {
            transform: scale(1.2);
        }
        80% {
            transform: scale(1);
        }
        100% {
            transform: scale(1);
        }
    }

    /* Responsive Adjustments */
    @media (max-width: 576px) {
        .whatsapp-button {
            width: 50px;
            height: 50px;
            top: 15px;
            right: 15px;
        }
        .whatsapp-button img {
            width: 26px;
            height: 26px;
        }
    }
</style>
