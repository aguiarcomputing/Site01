<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>Últimas Notícias sobre Hardware - Aguiar Informática</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="notícias, hardware, tecnologia, inovações, equipamentos" name="keywords">
    <meta content="AQUI VOCÊ CONSULTA DISPONIBILIDADE DOS NOSSOS SERVIÇOS COM CALENDÁRIO 2025" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Saira:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <!-- Favicon padrão -->
    <link rel="icon" href="flaticon.ico" type="image/x-icon">
    <link rel="icon" sizes="192x192" href="favicon-192x192.png">
    <link rel="icon" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" sizes="16x16" href="favicon-16x16.png">

    <style>
        /* CSS para tornar o botão do WhatsApp flutuante */
        .whatsapp-button {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
        }

        .whatsapp-button img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        /* Estilo para o Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            padding-top: 60px;
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 8px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Spinner Start -->
    <div id="spinner" class="show position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-grow text-primary" role="status"></div>
    </div>
    <!-- Spinner End -->

    <!-- Botão de WhatsApp no Cabeçalho -->
    <a href="https://wa.me/5548991890567" class="whatsapp-button" target="_blank" title="WhatsApp Online">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>

    <div class="container">
        <h1>Calendário 2025</h1>
        <div class="calendar">
            <!-- Janeiro -->
            <div class="month">
                <h2>Janeiro</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Dom</th>
                            <th>Seg</th>
                            <th>Ter</th>
                            <th>Qua</th>
                            <th>Qui</th>
                            <th>Sex</th>
                            <th>Sáb</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td>
                        </tr>
                        <tr>
                            <td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td>
                        </tr>
                        <tr>
                            <td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td>
                        </tr>
                        <tr>
                            <td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td>
                        </tr>
                        <tr>
                            <td>28</td><td>29</td><td>30</td><td>31</td><td></td><td></td><td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for scheduling -->
    <div class="modal" id="scheduleModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Agendar Serviço de Manutenção</h3>
            <p id="selectedDate"></p>

            <label for="deviceType">Tipo de Dispositivo</label>
            <select id="deviceType">
                <option value="">Selecione o dispositivo</option>
                <option value="Computador">Computador</option>
                <option value="Notebook">Notebook</option>
            </select>
            <br><br>

            <label for="serviceType">Tipo de Serviço</label>
            <select id="serviceType">
                <option value="">Selecione o serviço</option>
                <option value="Limpeza Interna">Limpeza Interna</option>
                <option value="Troca de Peças">Troca de Peças</option>
                <option value="Formatação">Formatação</option>
                <option value="Atualização de Sistema">Atualização de Sistema</option>
                <option value="Manutenção Geral">Manutenção Geral</option>
            </select>
            <br><br>

            <label for="description">Descrição do Problema</label>
            <textarea id="description" rows="4" placeholder="Descreva o problema ou solicitação"></textarea>
            <br><br>

            <button onclick="scheduleService()">Agendar</button>
        </div>
    </div>

    <script>
        const days = document.querySelectorAll(".month td");
        const modal = document.getElementById("scheduleModal");
        const selectedDate = document.getElementById("selectedDate");

        days.forEach(day => {
            day.addEventListener("click", () => {
                if (day.textContent.trim() !== "") {
                    selectedDate.textContent = `Dia selecionado: ${day.textContent}`;
                    modal.style.display = "flex";
                }
            });
        });

        function closeModal() {
            modal.style.display = "none";
        }

        function scheduleService() {
            const device = document.getElementById("deviceType").value;
            const service = document.getElementById("serviceType").value;
            const description = document.getElementById("description").value;

            if (device && service && description) {
                alert(`Serviço de ${service} para ${device} agendado para ${selectedDate.textContent}. Descrição: ${description}`);
                closeModal();
            } else {
                alert("Por favor, preencha todos os campos antes de agendar o serviço.");
            }
        }
    </script>
</body>
</html>
