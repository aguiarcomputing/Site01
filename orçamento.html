<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Orçamento de TI Avançado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const BudgetApp = () => {
            const [company, setCompany] = useState({ name: '', logo: '' });
            const [client, setClient] = useState({ name: '', email: '', phone: '' });
            const [services, setServices] = useState([]);
            const [newService, setNewService] = useState({ description: '', price: '', quantity: 1 });
            const [tax, setTax] = useState(0);
            const [discount, setDiscount] = useState(0);
            const [validity, setValidity] = useState('');
            const [savedBudgets, setSavedBudgets] = useState([]);
            const [showSaved, setShowSaved] = useState(false);

            useEffect(() => {
                const saved = JSON.parse(localStorage.getItem('budgets') || '[]');
                setSavedBudgets(saved);
            }, []);

            const addService = () => {
                if (newService.description && newService.price && newService.quantity) {
                    setServices([...services, { ...newService, price: parseFloat(newService.price) }]);
                    setNewService({ description: '', price: '', quantity: 1 });
                } else {
                    alert('Preencha todos os campos do serviço.');
                }
            };

            const removeService = (index) => {
                setServices(services.filter((_, i) => i !== index));
            };

            const calculateTotal = () => {
                const subtotal = services.reduce((sum, s) => sum + s.price * s.quantity, 0);
                const taxAmount = (subtotal * tax) / 100;
                const discountAmount = (subtotal * discount) / 100;
                return subtotal + taxAmount - discountAmount;
            };

            const saveBudget = () => {
                const budget = { company, client, services, tax, discount, validity, date: new Date().toISOString() };
                const updatedBudgets = [...savedBudgets, budget];
                setSavedBudgets(updatedBudgets);
                localStorage.setItem('budgets', JSON.stringify(updatedBudgets));
                alert('Orçamento salvo com sucesso!');
            };

            const generatePDF = () => {
                const element = document.getElementById('preview');
                html2pdf().from(element).set({ filename: 'orcamento_ti.pdf' }).save();
            };

            const sendEmail = () => {
                if (!client.email) {
                    alert('Insira o e-mail do cliente.');
                    return;
                }
                const subject = encodeURIComponent('Orçamento de Serviços de TI');
                const body = encodeURIComponent(document.getElementById('preview').innerText);
                window.location.href = `mailto:${client.email}?subject=${subject}&body=${body}`;
            };

            const sendWhatsApp = () => {
                if (!client.phone) {
                    alert('Insira o número do WhatsApp do cliente.');
                    return;
                }
                const message = encodeURIComponent(document.getElementById('preview').innerText);
                window.open(`https://wa.me/${client.phone}?text=${message}`);
            };

            return (
                <div className="container mx-auto p-6 max-w-4xl">
                    <h1 className="text-4xl font-bold text-center mb-8 text-cyan-400 animate-pulse">Gerador de Orçamento de TI</h1>
                    
                    {/* Empresa */}
                    <div className="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                        <h2 className="text-xl font-semibold text-cyan-300 mb-4">Dados da Empresa</h2>
                        <input
                            type="text"
                            placeholder="Nome da Empresa"
                            value={company.name}
                            onChange={(e) => setCompany({ ...company, name: e.target.value })}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                        <input
                            type="text"
                            placeholder="URL do Logo (opcional)"
                            value={company.logo}
                            onChange={(e) => setCompany({ ...company, logo: e.target.value })}
                            className="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                    </div>

                    {/* Cliente */}
                    <div className="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                        <h2 className="text-xl font-semibold text-cyan-300 mb-4">Dados do Cliente</h2>
                        <input
                            type="text"
                            placeholder="Nome do Cliente"
                            value={client.name}
                            onChange={(e) => setClient({ ...client, name: e.target.value })}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                        <input
                            type="email"
                            placeholder="E-mail do Cliente"
                            value={client.email}
                            onChange={(e) => setClient({ ...client, email: e.target.value })}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                        <input
                            type="text"
                            placeholder="WhatsApp do Cliente (ex: +5511999999999)"
                            value={client.phone}
                            onChange={(e) => setClient({ ...client, phone: e.target.value })}
                            className="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                    </div>

                    {/* Serviços */}
                    <div className="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                        <h2 className="text-xl font-semibold text-cyan-300 mb-4">Adicionar Serviço</h2>
                        <textarea
                            placeholder="Descrição do Serviço"
                            value={newService.description}
                            onChange={(e) => setNewService({ ...newService, description: e.target.value })}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                            rows="3"
                        ></textarea>
                        <input
                            type="number"
                            placeholder="Valor do Serviço (R$)"
                            value={newService.price}
                            onChange={(e) => setNewService({ ...newService, price: e.target.value })}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                        <input
                            type="number"
                            placeholder="Quantidade"
                            value={newService.quantity}
                            onChange={(e) => setNewService({ ...newService, quantity: parseInt(e.target.value) })}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                        <button
                            onClick={addService}
                            className="bg-cyan-500 text-gray-900 px-4 py-2 rounded-lg hover:bg-cyan-400 transition duration-300"
                        >
                            Adicionar Serviço
                        </button>
                    </div>

                    {/* Tabela de Serviços */}
                    <div className="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                        <table className="w-full border-collapse">
                            <thead>
                                <tr className="bg-gray-700">
                                    <th className="border border-gray-600 p-3">Descrição</th>
                                    <th className="border border-gray-600 p-3">Quantidade</th>
                                    <th className="border border-gray-600 p-3">Valor Unitário (R$)</th>
                                    <th className="border border-gray-600 p-3">Total (R$)</th>
                                    <th className="border border-gray-600 p-3">Ação</th>
                                </tr>
                            </thead>
                            <tbody>
                                {services.map((service, index) => (
                                    <tr key={index} className="hover:bg-gray-600">
                                        <td className="border border-gray-600 p-3">{service.description}</td>
                                        <td className="border border-gray-600 p-3">{service.quantity}</td>
                                        <td className="border border-gray-600 p-3">{service.price.toFixed(2)}</td>
                                        <td className="border border-gray-600 p-3">{(service.price * service.quantity).toFixed(2)}</td>
                                        <td className="border border-gray-600 p-3">
                                            <button
                                                onClick={() => removeService(index)}
                                                className="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-400"
                                            >
                                                Remover
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot>
                                <tr className="bg-gray-700">
                                    <td colSpan="3" className="border border-gray-600 p-3 font-bold">Subtotal:</td>
                                    <td colSpan="2" className="border border-gray-600 p-3 font-bold">
                                        R${services.reduce((sum, s) => sum + s.price * s.quantity, 0).toFixed(2)}
                                    </td>
                                </tr>
                                <tr>
                                    <td colSpan="3" className="border border-gray-600 p-3">Impostos (%):</td>
                                    <td colSpan="2" className="border border-gray-600 p-3">
                                        <input
                                            type="number"
                                            value={tax}
                                            onChange={(e) => setTax(parseFloat(e.target.value) || 0)}
                                            className="w-full p-2 bg-gray-600 rounded-lg text-white focus:outline-none"
                                        />
                                    </td>
                                </tr>
                                <tr>
                                    <td colSpan="3" className="border border-gray-600 p-3">Desconto (%):</td>
                                    <td colSpan="2" className="border border-gray-600 p-3">
                                        <input
                                            type="number"
                                            value={discount}
                                            onChange={(e) => setDiscount(parseFloat(e.target.value) || 0)}
                                            className="w-full p-2 bg-gray-600 rounded-lg text-white focus:outline-none"
                                        />
                                    </td>
                                </tr>
                                <tr className="bg-gray-700">
                                    <td colSpan="3" className="border border-gray-600 p-3 font-bold">Total Geral:</td>
                                    <td colSpan="2" className="border border-gray-600 p-3 font-bold">
                                        R${calculateTotal().toFixed(2)}
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    {/* Validade e Ações */}
                    <div className="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                        <label className="block mb-2 text-cyan-300">Validade do Orçamento</label>
                        <input
                            type="date"
                            value={validity}
                            onChange={(e) => setValidity(e.target.value)}
                            className="w-full p-3 mb-4 bg-gray-700 rounded-lg border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        />
                        <div className="flex space-x-4">
                            <button
                                onClick={saveBudget}
                                className="bg-green-500 text-gray-900 px-4 py-2 rounded-lg hover:bg-green-400 transition duration-300"
                            >
                                Salvar Orçamento
                            </button>
                            <button
                                onClick={generatePDF}
                                className="bg-blue-500 text-gray-900 px-4 py-2 rounded-lg hover:bg-blue-400 transition duration-300"
                            >
                                Gerar PDF
                            </button>
                            <button
                                onClick={sendEmail}
                                className="bg-purple-500 text-gray-900 px-4 py-2 rounded-lg hover:bg-purple-400 transition duration-300"
                            >
                                Enviar por E-mail
                            </button>
                            <button
                                onClick={sendWhatsApp}
                                className="bg-teal-500 text-gray-900 px-4 py-2 rounded-lg hover:bg-teal-400 transition duration-300"
                            >
                                Enviar por WhatsApp
                            </button>
                            <button
                                onClick={() => setShowSaved(true)}
                                className="bg-yellow-500 text-gray-900 px-4 py-2 rounded-lg hover:bg-yellow-400 transition duration-300"
                            >
                                Ver Orçamentos Salvos
                            </button>
                        </div>
                    </div>

                    {/* Preview */}
                    <div id="preview" className="bg-gray-800 p-6 rounded-lg shadow-lg">
                        <div className="flex justify-between items-center mb-4">
                            {company.logo && <img src={company.logo} alt="Logo" className="h-16" />}
                            <h2 className="text-2xl font-bold text-cyan-400">Orçamento de TI</h2>
                        </div>
                        <p><strong>Empresa:</strong> {company.name || 'Sua Empresa'}</p>
                        <p><strong>Cliente:</strong> {client.name || 'Nome do Cliente'}</p>
                        <p><strong>Validade:</strong> {validity || 'Não especificado'}</p>
                        <table className="w-full border-collapse mt-4">
                            <thead>
                                <tr className="bg-gray-700">
                                    <th className="border border-gray-600 p-3">Descrição</th>
                                    <th className="border border-gray-600 p-3">Quantidade</th>
                                    <th className="border border-gray-600 p-3">Valor Unitário</th>
                                    <th className="border border-gray-600 p-3">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {services.map((service, index) => (
                                    <tr key={index}>
                                        <td className="border border-gray-600 p-3">{service.description}</td>
                                        <td className="border border-gray-600 p-3">{service.quantity}</td>
                                        <td className="border border-gray-600 p-3">R${service.price.toFixed(2)}</td>
                                        <td className="border border-gray-600 p-3">R${(service.price * service.quantity).toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colSpan="3" className="border border-gray-600 p-3 font-bold">Subtotal:</td>
                                    <td className="border border-gray-600 p-3 font-bold">
                                        R${services.reduce((sum, s) => sum + s.price * s.quantity, 0).toFixed(2)}
                                    </td>
                                </tr>
                                <tr>
                                    <td colSpan="3" className="border border-gray-600 p-3">Impostos ({tax}%):</td>
                                    <td className="border border-gray-600 p-3">
                                        R${((services.reduce((sum, s) => sum + s.price * s.quantity, 0) * tax) / 100).toFixed(2)}
                                    </td>
                                </tr>
                                <tr>
                                    <td colSpan="3" className="border border-gray-600 p-3">Desconto ({discount}%):</td>
                                    <td className="border border-gray-600 p-3">
                                        R${((services.reduce((sum, s) => sum + s.price * s.quantity, 0) * discount) / 100).toFixed(2)}
                                    </td>
                                </tr>
                                <tr className="bg-gray-700">
                                    <td colSpan="3" className="border border-gray-600 p-3 font-bold">Total Geral:</td>
                                    <td className="border border-gray-600 p-3 font-bold">R${calculateTotal().toFixed(2)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    {/* Modal para Orçamentos Salvos */}
                    {showSaved && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                            <div className="bg-gray-800 p-6 rounded-lg max-w-2xl w-full">
                                <h2 className="text-xl font-bold text-cyan-400 mb-4">Orçamentos Salvos</h2>
                                {savedBudgets.length === 0 ? (
                                    <p>Nenhum orçamento salvo.</p>
                                ) : (
                                    savedBudgets.map((budget, index) => (
                                        <div key={index} className="mb-4 p-4 bg-gray-700 rounded-lg">
                                            <p><strong>Cliente:</strong> {budget.client.name}</p>
                                            <p><strong>Data:</strong> {new Date(budget.date).toLocaleDateString()}</p>
                                            <p><strong>Total:</strong> R${budget.services.reduce((sum, s) => sum + s.price * s.quantity, 0).toFixed(2)}</p>
                                        </div>
                                    ))
                                )}
                                <button
                                    onClick={() => setShowSaved(false)}
                                    className="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-400"
                                >
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<BudgetApp />, document.getElementById('root'));
    </script>
</body>
</html>
